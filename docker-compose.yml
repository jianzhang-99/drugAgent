version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: drug-agent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: drug_agent
      MYSQL_USER: drug_user
      MYSQL_PASSWORD: drug_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./taskboard-schema.sql:/docker-entrypoint-initdb.d/2-taskboard-schema.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  drug-agent-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drug-agent-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/drug_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_AI_ALIBABA_API_KEY: ${SPRING_AI_ALIBABA_API_KEY:-demo-key}
      JWT_SECRET: ${JWT_SECRET:-drug-agent-secret-key-2024}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped

  drug-agent-frontend:
    build:
      context: ./drug-agent-web
      dockerfile: Dockerfile
    container_name: drug-agent-frontend
    ports:
      - "3000:80"
    depends_on:
      - drug-agent-backend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  mysql_data:
    driver: local

networks:
  default:
    name: drug-agent-network
