spring:
  application:
    name: drug-agent
  profiles:
    active: local
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  ai:
    # 阿里云百炼(DashScope) - Anthropic 兼容模式
    dashscope:
      enabled: true
      api-key: sk-a433391322b54c3db665851b085ba4d4
      base-url: https://dashscope.aliyuncs.com/apps/anthropic
      chat:
        options:
          model: qwen3.5-plus
    # MiniMax - Anthropic 兼容模式
    anthropic:
      enabled: true
      base-url: https://api.minimaxi.com/anthropic
      api-key: ${minimax.api-key:}
      chat:
        options:
          model: ${minimax.model:MiniMax-M2.7}
          max-tokens: ${minimax.max-tokens:8192}
          temperature: ${minimax.temperature:0.7}
    # OpenAI (用于 Embedding)
    openai:
      enabled: true
      api-key: ${OPENAI_API_KEY:sk-ant-api03-placeholder}
      base-url: https://api.openai.com/v1

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

server:
  port: 8124
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.liang.drugagent

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    root: INFO
    com.liang.drugagent: DEBUG

# 阿里云百炼(DashScope) 千问模型配置
aliyun:
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}

# MiniMax模型配置
minimax:
  api-key: ${MINIMAX_API_KEY:}
  model: MiniMax-M2.7
  max-tokens: 8192
  temperature: 0.7

# Agent 路由配置
agent:
  routing:
    llm-enabled: true
    llm-timeout: 10000
    confidence-threshold: 0.75
    confidence-low-threshold: 0.5

# LLM统一配置
llm:
  default-provider: MINIMAX
  routing-provider: MINIMAX
  chat-provider: MINIMAX
  report-provider: MINIMAX
