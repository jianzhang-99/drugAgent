spring:
  application:
    name: drug-agent
  profiles:
    active: local
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  ai:
    dashscope:
      api-key: ${aliyun.dashscope.api-key}
      chat:
        options:
          model: qwen-plus
      embedding:
        options:
          model: text-embedding-v3

server:
  port: 8124
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.liang.drugagent

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    root: INFO
    com.liang.drugagent: DEBUG

# 阿里云百炼(DashScope) 千问模型配置
aliyun:
  dashscope:
    api-key: ${DASHscope_API_KEY:} # 优先从环境变量读取，本地开发则由 application-local.yml 覆盖

# Agent 路由配置
agent:
  routing:
    llm-enabled: true  # 百炼路由开关
    llm-timeout: 10000 # 百炼调用超时(ms)
    confidence-threshold: 0.75  # 采纳阈值
    confidence-low-threshold: 0.5  # 回退阈值

# MiniMax模型配置
minimax:
  enabled: true
  api-key: ${MINIMAX_API_KEY:}
  base-url: https://api.minimaxi.com
  model: MiniMax-M2.7
  timeout: 60000
  max-tokens: 8192
  temperature: 0.7
  stream: true

# LLM统一配置
llm:
  default-provider: MINIMAX  # 默认Provider: DASHSCOPE 或 MINIMAX
  routing-provider: MINIMAX   # 路由场景使用的Provider
  chat-provider: MINIMAX      # 通用问答使用的Provider
  report-provider: MINIMAX    # 报告生成使用的Provider
