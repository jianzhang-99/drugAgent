spring:
  application:
    name: drug-agent
  profiles:
    active: local
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

# Web 服务配置
server:
  port: 8124
  servlet:
    context-path: /api
    multipart:
      max-file-size: ${app.multipart.max-file-size:100MB}
      max-request-size: ${app.multipart.max-request-size:100MB}

# OpenAPI / Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.liang.drugagent

knife4j:
  enable: true
  setting:
    language: zh_cn

# 日志配置
logging:
  level:
    root: INFO
    com.liang.drugagent: DEBUG

# 模型与 AI 能力配置
aliyun:
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
    chat-model: ${DASHSCOPE_CHAT_MODEL:qwen3.5-plus}
    embedding-model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v2}

minimax:
  api-key: ${MINIMAX_API_KEY:}
  base-url: ${MINIMAX_BASE_URL:https://api.minimaxi.com/anthropic}
  model: MiniMax-M2.7-highspeed
  max-tokens: 8192
  temperature: 0.7
  top-p: 0.9

# 向量库配置
pgvector:
  dimension: 1024
  table-name: vector_store

# 应用层通用配置
app:
  multipart:
    max-file-size: 100MB
    max-request-size: 100MB

# Agent 路由配置
agent:
  routing:
    llm-enabled: true
    llm-timeout: 10000
    confidence-threshold: 0.75
    confidence-low-threshold: 0.5

# LLM 统一路由策略
llm:
  default-provider: MINIMAX
  routing-provider: MINIMAX
  chat-provider: MINIMAX
  report-provider: MINIMAX
